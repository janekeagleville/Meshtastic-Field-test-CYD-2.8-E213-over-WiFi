; CYD Field TCP for HeltecE213 - dwie plytki w jednym projekcie, polaczone przez WiFi:
;   e213              Heltec Vision Master E213: tester LoRa (wlasne radio) + punkt dostepowy WiFi + API Meshtastic na porcie 4403
;   cyd_st7789_noinv  CYD 2,8" (ESP32-2432S028): ekran pomiarowy, laczy sie z E213 jak z wezlem Meshtastic
;   cyd_st7789 / cyd_ili9341  inne warianty panelu CYD (jak w projekcie "CYD Field for HeltecV4")
; W VS Code wybierz srodowisko na dolnym pasku (env:...) i wgraj kazda plytke osobno.
; Nazwa i haslo sieci WiFi: include/link.h (wspolne dla obu plytek).

[platformio]
default_envs = e213

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200

; ---------------- Heltec Vision Master E213 ----------------
[env:e213]
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_src_filter = +<e213/>
lib_deps =
    jgromes/RadioLib@7.1.2
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.16.0
    ; fork GxEPD2 z Meshtastic: sterowniki obu wersji panelu E213 (LCMEN2R13EFC1 i E0213A367)
    https://github.com/meshtastic/GxEPD2/archive/c7eb4c3c167cf396ef4f541cc5d4c6aa42f3c46b.zip
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I include/e213
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; ---------------- CYD 2,8" ESP32-2432S028 ----------------
[cyd]
board = esp32dev
; 3 MB na program: mapy (mapdata.h, maphires.h, mapwaw.h) zajmuja ok. 600 kB
board_build.partitions = huge_app.csv
build_src_filter = +<cyd/>
lib_deps = bodmer/TFT_eSPI@2.5.43
build_flags =
  -I include/cyd
  -D USER_SETUP_LOADED=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D USE_HSPI_PORT
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D SPI_FREQUENCY=27000000

; Panele CYD 2,8" z dwoma USB bywaja ST7789 bez inwersji: gdy czern wychodzi jako biel (cyjan jako czerwien), to srodowisko jest wlasciwe.
[env:cyd_st7789_noinv]
extends = cyd
build_flags = ${cyd.build_flags}
  -D ST7789_DRIVER
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_INVERSION_OFF
  -D SPI_MODE=3

[env:cyd_st7789]
extends = cyd
build_flags = ${cyd.build_flags}
  -D ST7789_DRIVER
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_INVERSION_ON
  -D SPI_MODE=3

[env:cyd_ili9341]
extends = cyd
build_flags = ${cyd.build_flags}
  -D ILI9341_DRIVER
